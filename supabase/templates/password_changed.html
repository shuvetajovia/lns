<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Mother Nature password has changed</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f3f5ef;color:#20342a;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #d7dfd4;border-radius:10px">
    <div style="padding:16px 24px;background:#28523b;color:#ffffff;font-size:19px;font-weight:bold">Mother Nature</div>
    <div style="padding:8px 24px 20px;font-size:16px;line-height:1.55">
      <h1 style="margin:16px 0;font-size:25px;line-height:1.25">Your password has changed</h1>
      <p>The password for your Mother Nature account was changed. Use your new password the next time you sign in.</p>
      <p><strong>Did someone else make this change?</strong> Open the Mother Nature store, go to the sign-in page and select the forgot-password link to secure your account.</p>
    </div>
  </div>
</body>
</html>
